aid: commodity-futures-trading-commission
url: https://raw.githubusercontent.com/api-evangelist/commodity-futures-trading-commission/refs/heads/main/apis.yml
name: Commodity Futures Trading Commission
kind: government
description: >-
  The Commodity Futures Trading Commission (CFTC) is the U.S. federal regulator for commodity futures and options
  markets. The CFTC publishes the weekly Commitments of Traders (COT) report and other public data through a Socrata
  Open Data API at publicreporting.cftc.gov, providing programmatic access to Legacy, Disaggregated, Traders in
  Financial Futures, and Supplemental Commodity Index Trader datasets, as well as swap data and large trader reports.
